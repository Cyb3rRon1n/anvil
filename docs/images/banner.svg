<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="300" fill="#14161a"/>

  <!-- rack-shelf texture, matching Vulcan's sibling banner -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- GPU-card + spark mark -->
  <g transform="translate(38,34.5) scale(3.5)">
    <g transform="rotate(-20 32 32)">
      <rect fill="#c7ced6" x="14" y="22" width="28" height="13" rx="3"/>
      <rect fill="#c7ced6" x="25" y="33" width="8" height="24" rx="2"/>
    </g>
    <path fill="#3a9fe0" d="M14 4 L17 11 L24 14 L17 17 L14 24 L11 17 L4 14 L11 11 Z"/>
  </g>

  <!-- wordmark -->
  <text x="280" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="6" fill="#f0f2f5">ANVIL</text>
  <text x="282" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="22" fill="#9aa1ab">A GPU-compute creativity forge, sized to your real VRAM</text>

  <!-- tier ticks: Light / Medium / Heavy -->
  <g fill="#3a9fe0">
    <rect x="1042" y="242" width="16" height="18" opacity="0.55"/>
    <rect x="1067" y="232" width="16" height="28" opacity="0.78"/>
    <rect x="1092" y="222" width="16" height="38" opacity="1"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="1050" y="274">L</text>
    <text x="1075" y="274">M</text>
    <text x="1100" y="274">H</text>
  </g>
</svg>
